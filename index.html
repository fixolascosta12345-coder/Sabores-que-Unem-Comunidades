<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabores que Unem Comunidades - E-book Interativo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1>Sabores que Unem Comunidades</h1>
                <p class="subtitle">Flavours that Unite Communities • Saveurs qui Unissent les Communautés</p>
            </div>
            <div class="language-selector">
                <button class="lang-btn active" data-lang="pt">PT</button>
                <button class="lang-btn" data-lang="en">EN</button>
                <button class="lang-btn" data-lang="fr">FR</button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Pages Container (Scrollable) -->
            <div class="pages-container">
                <div class="pages-wrapper">
                    <img id="page1" src="assets/pages/page-03.png" alt="Página 3" class="page-item">
                    <img id="page2" src="assets/pages/page-04.png" alt="Página 4" class="page-item">
                    <img id="page3" src="assets/pages/page-05.png" alt="Página 5" class="page-item">
                    <img id="page4" src="assets/pages/page-06.png" alt="Página 6" class="page-item">
                    <img id="page5" src="assets/pages/page-07.png" alt="Página 7" class="page-item">
                    <img id="page6" src="assets/pages/page-08.png" alt="Página 8" class="page-item">
                    <img id="page7" src="assets/pages/page-09.png" alt="Página 9" class="page-item">
                    <img id="page8" src="assets/pages/page-10.png" alt="Página 10" class="page-item">
                    <img id="page9" src="assets/pages/page-11.png" alt="Página 11" class="page-item">
                    <img id="page10" src="assets/pages/page-12.png" alt="Página 12" class="page-item">
                    <img id="page11" src="assets/pages/page-13.png" alt="Página 13" class="page-item">
                    <img id="page12" src="assets/pages/page-14.png" alt="Página 14" class="page-item">
                    <img id="page13" src="assets/pages/page-15.png" alt="Página 15" class="page-item">
                </div>
            </div>

            <!-- Controls -->
            <div class="controls">
                <button id="prevBtn" class="btn btn-nav" data-i18n="previous">← Anterior</button>
                <div class="page-info">
                    <span id="pageNumber">3</span> / <span id="totalPages">15</span>
                </div>
                <button id="nextBtn" class="btn btn-nav" data-i18n="next">Próximo →</button>
            </div>

            <!-- Zoom Controls -->
            <div class="zoom-controls">
                <button id="zoomOut" class="btn btn-small" data-i18n="zoomOut">−</button>
                <span id="zoomLevel">100%</span>
                <button id="zoomIn" class="btn btn-small" data-i18n="zoomIn">+</button>
                <button id="fitScreen" class="btn btn-small" data-i18n="fit">Ajustar</button>
            </div>
        </main>
    </div>

    <!-- Internationalization -->
    <script>
        const translations = {
            pt: {
                previous: '← Anterior',
                next: 'Próximo →',
                zoomOut: '−',
                zoomIn: '+',
                fit: 'Ajustar'
            },
            en: {
                previous: '← Previous',
                next: 'Next →',
                zoomOut: '−',
                zoomIn: '+',
                fit: 'Fit'
            },
            fr: {
                previous: '← Précédent',
                next: 'Suivant →',
                zoomOut: '−',
                zoomIn: '+',
                fit: 'Ajuster'
            }
        };

        let currentLanguage = 'pt';
        let currentPage = 3;
        let totalPages = 15;
        let zoomLevel = 100;

        // Language switching
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentLanguage = e.target.dataset.lang;
                updateTranslations();
            });
        });

        function updateTranslations() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.dataset.i18n;
                el.textContent = translations[currentLanguage][key] || key;
            });
        }

        // Page navigation
        function goToPage(pageNum) {
            if (pageNum >= 3 && pageNum <= totalPages) {
                currentPage = pageNum;
                const container = document.querySelector('.pages-container');
                const pageIndex = pageNum - 3;
                const scrollPosition = pageIndex * container.offsetWidth;
                
                container.scrollTo({
                    left: scrollPosition,
                    behavior: 'smooth'
                });
                
                document.getElementById('pageNumber').textContent = pageNum;
                updateNavButtons();
            }
        }

        function updateNavButtons() {
            document.getElementById('prevBtn').disabled = currentPage <= 3;
            document.getElementById('nextBtn').disabled = currentPage >= totalPages;
        }

        document.getElementById('prevBtn').addEventListener('click', () => {
            if (currentPage > 3) goToPage(currentPage - 1);
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            if (currentPage < totalPages) goToPage(currentPage + 1);
        });

        // Zoom controls
        document.getElementById('zoomIn').addEventListener('click', () => {
            if (zoomLevel < 200) {
                zoomLevel += 10;
                updateZoom();
            }
        });

        document.getElementById('zoomOut').addEventListener('click', () => {
            if (zoomLevel > 50) {
                zoomLevel -= 10;
                updateZoom();
            }
        });

        document.getElementById('fitScreen').addEventListener('click', () => {
            zoomLevel = 100;
            updateZoom();
        });

        function updateZoom() {
            const wrapper = document.querySelector('.pages-wrapper');
            wrapper.style.transform = `scale(${zoomLevel / 100})`;
            document.getElementById('zoomLevel').textContent = zoomLevel + '%';
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' && currentPage > 3) goToPage(currentPage - 1);
            if (e.key === 'ArrowRight' && currentPage < totalPages) goToPage(currentPage + 1);
        });

        // Initialize
        updateTranslations();
        updateNavButtons();
        document.getElementById('totalPages').textContent = totalPages;
    </script>
</body>
</html>
